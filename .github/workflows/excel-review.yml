name: Excel review regression

on:
  pull_request:
    paths:
      - '*.ps1'
      - 'Tests/**'
      - '.github/workflows/excel-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows (${{ matrix.shell }})
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Run assessment and native Excel regressions
        shell: pwsh
        env:
          TEST_ENGINE: ${{ matrix.shell }}
        run: |
          $ErrorActionPreference = 'Stop'
          $resultsPath = Join-Path $env:RUNNER_TEMP 'assessment-results.json'
          & $env:TEST_ENGINE -NoLogo -NoProfile -File .\Tests\Test-NtfsAssessment.ps1 -ResultsPath $resultsPath
          if ($LASTEXITCODE -ne 0) {
              throw "Assessment regression process exited with $LASTEXITCODE."
          }
          $result = Get-Content -LiteralPath $resultsPath -Raw | ConvertFrom-Json
          if (-not $result.Completed -or -not $result.CleanupCompleted -or
              @($result.Checks).Count -eq 0 -or
              @($result.Checks | Where-Object { -not $_.Passed }).Count -gt 0) {
              throw 'Assessment regression harness did not complete successfully.'
          }
